[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "design2build"
version = "1.1.0"
description = "Design2Build: Reusable, agent-native visual coding engine and workflow"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Subhadeep Chakravarty & Design2Build Contributors" }
]
dependencies = [
    "pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0"
]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
d2b = "stc_core.cli:cli"
design2build = "stc_core.cli:cli"
stc = "stc_core.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["stc_core*"]

